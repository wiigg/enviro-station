name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  location-privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check location privacy
        run: ./scripts/check-location-privacy.sh

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: integration
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod

      - name: Set up device Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Test backend
        working-directory: backend
        run: go test ./...
        env:
          ENVIRO_TEST_POSTGRES_URL: postgres://postgres:integration@127.0.0.1:${{ job.services.postgres.ports[5432] }}/postgres?sslmode=disable

  dashboard-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard-v2/package-lock.json

      - name: Install dashboard-v2 dependencies
        working-directory: dashboard-v2
        run: npm ci

      - name: Lint dashboard-v2
        working-directory: dashboard-v2
        run: npm run lint

      - name: Test dashboard-v2
        working-directory: dashboard-v2
        run: npm test

      - name: Build dashboard-v2
        working-directory: dashboard-v2
        run: npm run build

  device:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Check device modules
        working-directory: device
        run: python -m compileall -q .

      - name: Test device transmitter
        run: python -m unittest discover -s device -p 'test_*.py'
