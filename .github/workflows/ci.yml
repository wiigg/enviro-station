name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  location-privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check location privacy
        run: ./scripts/check-location-privacy.sh

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: integration
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.4"

      - name: Set up device Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Test backend
        working-directory: backend
        run: go test ./...
        env:
          ENVIRO_TEST_POSTGRES_URL: postgres://postgres:integration@127.0.0.1:${{ job.services.postgres.ports[5432] }}/postgres?sslmode=disable

  dashboard-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"
          cache: npm
          cache-dependency-path: dashboard-v2/package-lock.json

      - name: Install dashboard-v2 dependencies
        working-directory: dashboard-v2
        run: npm ci

      - name: Lint dashboard-v2
        working-directory: dashboard-v2
        run: npm run lint

      - name: Test dashboard-v2
        working-directory: dashboard-v2
        run: npm test

      - name: Build dashboard-v2
        working-directory: dashboard-v2
        run: npm run build

  device:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Check device modules
        working-directory: device
        run: python -m compileall -q .

      - name: Test device transmitter
        run: python -m unittest discover -s device -p 'test_*.py'
